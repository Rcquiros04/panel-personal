<!DOCTYPE html>
<html lang="es">
    <head>
        <!-- Sin esta línea el navegador adivina la codificación y los
             grados salen como "15 Â°C" en vez de "15 °C". -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Noticias YA!</title>
        <link rel="stylesheet" type="text/css" href="../assets/styles.css">
    </head>
    <body>
        <div class="title">
            <h1>Portal de noticias</h1>
        </div>
        <div class="container">          
          <div class="bloque bloqueTiempo">
            <div class="bloqueHeader">Tiempo</div>
            <div class="divTiempo">
                <div id="tiempoMinTemp"></div>
                <div id="tiempoTemp"></div>
                <div id="tiempoMaxTemp"></div>
            </div>
            <div class="divTiempo">
                <div id="tiempoPrec"></div>
                <div id="tiempoCiudad"></div>
                <div id="tiempoInfo"></div>
            </div>
          </div>
          <div class="bloque bloqueHoras">
            <div class="bloqueHeader">Hora</div>
            <div class="divHoras" id="divHoras"></div>
          </div>
          <div class="bloque" id="bloqueNoticia">
            <div class="bloqueHeader">Última noticia</div>
            <div class="bloqueNoticia">
                <h2 id="noticiaTitulo"></h2>
                <div id="noticiaContenido"></div>
                <div id="noticiaAutor"></div>
            </div>
          </div>
          <div class="bloque bloqueCancion">
            <div class="bloqueHeader">Canción destacada del día</div>
            <div class="divCancion">
                <div>
                    <img src="../assets/artista.jpg">
                </div>
                <div>
                    We Are All Made of Stars - Moby
                </div>
                <div>
                    <audio id="cancionDia" controls></audio>
                </div>
            </div>
          </div>
        </div>        
        <!-- config.js no está en el repositorio: copia config.example.js.
             Sin él el panel arranca igual, con los valores por defecto. -->
        <script src="barra-portafolio.js" data-titulo="Panel de noticias" data-nota="Clima en vivo desde una API externa"></script>
        <script src="config.js" onerror="console.log('Sin config.js: se usan valores por defecto')"></script>
        <script src="index.js"></script>
      </body>
</html>
